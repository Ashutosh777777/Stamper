[project]
name = "search"
version = "0.1.0"
description = "Search using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[litellm,tools]==1.14.1",
]

[project.scripts]
search = "search.main:run"
run_crew = "search.main:run"
train = "search.main:train"
replay = "search.main:replay"
test = "search.main:test"
run_with_trigger = "search.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
